# =============================================================================
# Source registry. Native adapters ("kind": kwork, fl_ru, ...) carry sane
# defaults in Python; generic engines ("kind": rss | html | json) are fully
# described here - any niche marketplace can be added without touching code.
#
# Common fields:
#   enabled          - on/off (also toggled from Telegram /sources)
#   interval_seconds - polling interval for the light listing request
#   timeout          - HTTP timeout in seconds
#   proxy_url        - per-source proxy, e.g. http://user:pass@host:port
#   use_browser      - Playwright for public JS pages (no captcha bypass)
#   headers          - extra HTTP headers merged into the default ones
#   token_env        - env var with an official API token
#   max_items        - hard cap of jobs handled per scan
#
# Verified against live public endpoints on 2026-11-17:
#   Kwork              - https://kwork.ru/projects (stateData.wantsListData) OK
#   FL.ru              - https://www.fl.ru/projects/ (+ RSS fallback)       OK
#   Freelance.ru       - server-rendered article.task-card catalogue         OK
#   Freelancehunt      - public RSS https://freelancehunt.com/projects.rss   OK
#   Weblancer          - Next.js SSR RSC stream (no Playwright needed!)      OK
#   Workspace          - official RSS https://workspace.ru/tenders/rss/      OK
#   Kadrof             - generic HTML selector example (live working board)  OK
#   Freelancer.com     - official public REST API                            OK
#   Remotive/RemoteOK  - open JSON APIs + WeWorkRemotely RSS                 OK
#   Habr Freelance     - service closed permanently (RSS returns HTML notice)
#   YouDo              - ServicePipe JS challenge + captcha (not bypassed)
# =============================================================================

sources:
  # ---------------------------------------------------------------------------
  # 1. Kwork - real buyer projects from /projects (window.stateData JSON)
  # ---------------------------------------------------------------------------
  - name: kwork
    kind: kwork
    enabled: true
    interval_seconds: 60
    timeout: 25
    proxy_url: null
    use_browser: false
    max_items: 60
    params:
      # Общая лента + Разработка и IT (c=11) + Дизайн/логотипы (c=15) + Видео/анимация (c=7)
      min_request_interval: 0.35
      listing_urls:
        - "https://kwork.ru/projects"
        - "https://kwork.ru/projects?c=11"
        - "https://kwork.ru/projects?c=15"
        - "https://kwork.ru/projects?c=7"
      fetch_details: true

  # ---------------------------------------------------------------------------
  # 2. FL.ru - HTML project catalogue (exact bid counts) + RSS fallback
  # ---------------------------------------------------------------------------
  - name: fl_ru
    kind: fl_ru
    enabled: true
    interval_seconds: 90
    timeout: 25
    max_items: 50
    params:
      listing_url: "https://www.fl.ru/projects/"
      rss_url: "https://www.fl.ru/rss/all.xml"
      fetch_details: true

  # ---------------------------------------------------------------------------
  # 3. Freelance.ru - public HTML catalogue (article.task-card)
  # ---------------------------------------------------------------------------
  - name: freelance_ru
    kind: freelance_ru
    enabled: true
    interval_seconds: 120
    timeout: 25
    max_items: 40
    params:
      url: "https://freelance.ru/projects/"
      fetch_details: false

  # ---------------------------------------------------------------------------
  # 4. Freelancehunt - official API v2 with token, public RSS fallback
  # ---------------------------------------------------------------------------
  - name: freelancehunt
    kind: freelancehunt
    enabled: true
    interval_seconds: 120
    timeout: 25
    token_env: FREELANCEHUNT_TOKEN
    max_items: 50
    notes: "Токен API: https://freelancehunt.com/my/api (без него работает публичный RSS)."
    params:
      api_url: "https://api.freelancehunt.com/v2/projects"
      fallback_rss: "https://freelancehunt.com/projects.rss"

  # ---------------------------------------------------------------------------
  # 5. Weblancer - Next.js SSR RSC stream over plain HTTP (exact bids & USD)
  # ---------------------------------------------------------------------------
  - name: weblancer
    kind: weblancer
    enabled: true
    interval_seconds: 120
    timeout: 25
    use_browser: false
    currency: USD
    max_items: 30
    params:
      url: "https://www.weblancer.net/freelance/"
      fetch_details: false

  # ---------------------------------------------------------------------------
  # 6. Workspace - official tenders RSS + HTML catalogue fallback
  # ---------------------------------------------------------------------------
  - name: workspace
    kind: workspace
    enabled: true
    interval_seconds: 300
    timeout: 25
    max_items: 40
    params:
      rss_url: "https://workspace.ru/tenders/rss/"
      url: "https://workspace.ru/tenders/"

  # ---------------------------------------------------------------------------
  # 7. Kadrof.ru - live Russian freelance board via zero-code GenericHTMLAdapter
  # ---------------------------------------------------------------------------
  - name: kadrof
    kind: html
    enabled: true
    interval_seconds: 300
    timeout: 25
    currency: RUB
    max_items: 30
    params:
      url: "https://www.kadrof.ru/work"
      timezone: "Europe/Moscow"
    selectors:
      item: "div.post.project-list"
      title: ".project-title h6 a"
      url: ".project-title h6 a@href"
      price: ".project-title .budget"
      description: ":self"
      published_at: ".date"

  # ---------------------------------------------------------------------------
  # 8. Freelancer.com - official public REST API (no token required)
  # ---------------------------------------------------------------------------
  - name: freelancer_com
    kind: freelancer_com
    enabled: true
    interval_seconds: 120
    timeout: 30
    max_items: 40
    category: "Software Development"
    params:
      api_url: "https://www.freelancer.com/api/projects/0.1/projects/active/"
      query: "python OR bot OR telegram OR website OR landing OR scraper OR automation OR ai OR video OR logo"
      limit: 40

  # ---------------------------------------------------------------------------
  # 9. Remote boards aggregator (Remotive, RemoteOK, WeWorkRemotely RSS)
  # ---------------------------------------------------------------------------
  - name: remote_boards
    kind: remote_boards
    enabled: true
    interval_seconds: 300
    timeout: 30
    max_items: 50
    category: "Remote"
    params:
      boards:
        - name: remotive
          kind: remotive
          url: "https://remotive.com/api/remote-jobs?category=software-dev&limit=30"
        - name: remoteok
          kind: remoteok
          url: "https://remoteok.com/api"
          limit: 30
        - name: weworkremotely
          kind: rss
          url: "https://weworkremotely.com/categories/remote-programming-jobs.rss"

  # ---------------------------------------------------------------------------
  # 10. Habr Freelance - service closed permanently; kept for completeness
  # ---------------------------------------------------------------------------
  - name: habr_freelance
    kind: habr_freelance
    enabled: false
    interval_seconds: 300
    timeout: 25
    max_items: 40
    notes: "Сервис Хабр Фриланс закрылся навсегда (RSS отдаёт HTML-заглушку)."
    params:
      rss_url: "https://freelance.habr.com/tasks.rss"
      fetch_details: true

  # ---------------------------------------------------------------------------
  # 11. YouDo - ServicePipe JS challenge; disabled (no bypass)
  # ---------------------------------------------------------------------------
  - name: youdo
    kind: youdo
    enabled: false
    interval_seconds: 300
    timeout: 25
    max_items: 30
    notes: "Публичный каталог закрыт JS-антиботом ServicePipe, обход не поддерживается."
    params:
      url: "https://youdo.com/tasks-all-opened-all/"

