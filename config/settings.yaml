# =============================================================================
# Runtime settings. Everything here can be changed at runtime from Telegram
# (/filters) - overrides are stored in the `settings` DB table and take
# precedence over this file without a restart.
# =============================================================================

filters:
  # Budget thresholds (job currency is converted into RUB and USD first)
  min_budget_rub: 1000
  min_budget_usd: 15
  # Competition
  max_proposals: 5
  allow_unknown_proposals: true      # keep jobs whose proposal counter is unavailable
  # Notification threshold
  min_notify_score: 50
  # "Договорная" jobs
  allow_negotiable: true
  # Freshness
  max_age_minutes: 1440
  # Профиль: вайбкодинг (боты, сайты, проверки, доработки, скрипты) +
  # лёгкие ИИ-задачи (видео через Veo, логотипы, креативы, картинки).
  # Всегда можно изменить или очистить прямо в Telegram через /filters.
  include_keywords:
    # Кодинг / вайбкодинг / боты / сайты / проверки / доработки / автоматизация
    - python
    - "бот*"
    - "чат-бот*"
    - "чатбот*"
    - "тг-бот*"
    - "телеграм-бот*"
    - "телеграм бот*"
    - "telegram бот*"
    - "telegram bot*"
    - "mini app*"
    - "мини-прилож*"
    - "сайт*"
    - "лендинг*"
    - landing
    - "интернет-магазин*"
    - "веб-прилож*"
    - "веб-сервис*"
    - "web app"
    - webapp
    - website
    - "верстк*"
    - "вёрстк*"
    - wordpress
    - tilda
    - "тильд*"
    - webflow
    - opencart
    - битрикс
    - shopify
    - html
    - css
    - javascript
    - react
    - nextjs
    - "скрипт*"
    - "парсер*"
    - "парсинг*"
    - scraper
    - "автоматизац*"
    - automation
    - "интеграц*"
    - api
    - "webhook*"
    - "вебхук*"
    - n8n
    - "нейросет*"
    - "ии-агент*"
    - ии
    - ai
    - gpt
    - claude
    - "промпт*"
    # Лёгкий ИИ-дизайн / логотипы / картинки / AI-видео (Veo)
    - "логотип*"
    - лого
    - брендинг
    - "видеоролик*"
    - нейровидео
    - "ai-видео"
    - "ai video"
    - veo
    - sora
    - runway
    - kling
    - midjourney
    - "анимац*"
    - интро
    - reels
    - рилс
    - shorts
    - шортс
    - "монтаж видео"
    - "видеореклам*"
    - "промо-ролик*"
    - "проморолик*"
    - "баннер*"
    - "обложк*"
    - "инфографик*"
    - "иллюстрац*"
    - превью
    - "презентац*"
    - "креатив*"
    - "аватар*"
    - "стикер*"
  include_regex:
    - "\\b(?:проверк\\w*|тестир\\w*|аудит\\w*|доработ\\w*|правк\\w*|исправ\\w*|созда\\w*|сдела\\w*|разработ\\w*|настро\\w*)\\s+(?:\\w+\\s+){0,2}\\b(?:сайт\\w*|лендинг\\w*|страниц\\w*|магазин\\w*|веб\\w*|бот\\w*|скрипт\\w*|парсер\\w*|приложен\\w*|плагин\\w*|сервис\\w*)"
    - "\\b(?:созда\\w*|сдела\\w*|сгенерир\\w*|нарисова\\w*|оформ\\w*|придума\\w*)\\s+(?:\\w+\\s+){0,2}\\b(?:видео\\w*|ролик\\w*|логотип\\w*|лого\\b|баннер\\w*|картинк\\w*|аватар\\w*|обложк\\w*|презентац\\w*|инфографик\\w*|анимац\\w*|креатив\\w*)"
    - "\\b(?:бот\\w*|скрипт\\w*|парсер\\w*|автоматизац\\w*|мини[-\\s]?прилож\\w*)\\s+(?:\\w+\\s+){0,2}\\b(?:тг\\b|telegram\\b|телеграм\\w*|discord\\b|дискорд\\w*|whatsapp\\b|ватсап\\w*|вк\\b|vk\\b)"
    - "\\b(?:тг\\b|telegram\\b|телеграм\\w*|discord\\b|дискорд\\w*|whatsapp\\b|ватсап\\w*)\\s+(?:\\w+\\s+){0,2}\\b(?:бот\\w*|скрипт\\w*|парсер\\w*|автоматизац\\w*|мини[-\\s]?прилож\\w*)"
  exclude_keywords:
    - казино
    - casino
    - ставки
    - ставок
    - betting
    - gambling
    - букмекер
    - за отзыв
    - за отзывы
    - без оплаты
    - безвозмездно
    - бесплатно
    - 18+
    - интим
    - дропы
    - обнал
    - скам
    - "за 50 рублей"
    - пиратский
    - 1с
    - бартер
    - "найти клиент*"
    - "поиск клиент*"
    - "привести клиент*"
    - "привлечение клиент*"
    - менеджер по продажам
    - "холодн* звонк*"
    - "обзвон*"
    - "разместить объявлен*"
    - "выкладка объявлен*"
    - "выкладка товар*"
    - "обновлять карточк*"
    - "заполнение анкет*"
    - оператор чата
    - "перепечатка текст*"
    - прослушивание аудио
    - крауд постинг
    - упоминания бренда
    - "вентфасад*"
    - "роспись елочн*"
    - "роспись ёлочн*"
    - "накрутк*"
    - "подписчик*"
    - "отвечать на входящ*"
    - "отвечать на сообщ*"
    - "пройти верификац*"
    - "верификация аккаунт*"
    - "машинн* вышивк*"
    - "подработка без опыта"
    - "работа без опыта"
    - "написать карточки товар*"
    - "составлять карточки товар*"
    - "сортировк* данных"
    - выезд на объект
    - в офисе
  exclude_regex:
    - "(?:очн\\w*\\s+съ[её]мк|съ[её]мк\\w*(?:\\s+\\S+){0,4}\\s+(?:в\\s+москве|в\\s+спб|в\\s+офисе|на\\s+локации|для\\s+клиники|с\\s+выездом|на\\s+камеру)|выезд\\s+оператор)"
  # Never notify about these sources
  exclude_sources: []
  # Quiet hours (jobs keep collecting, digest is sent afterwards)
  quiet_hours:
    enabled: false
    start: "00:00"
    end: "08:00"
  # First launch on an empty DB: index everything silently instead of spamming 200 old cards
  cold_start_mode: silent_seed       # silent_seed | notify_all
  send_top_n_on_start: 0             # e.g. 3 - also send the 3 freshest jobs on first launch

scoring:
  weights:
    freshness: 25
    competition: 25
    budget: 20
    client: 15
    text: 15
  # A job younger than this gets the maximum freshness bonus
  fresh_window_minutes: 15

llm:
  enabled: false
  # Any OpenAI-compatible endpoint. For Ollama use http://localhost:11434/v1
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  timeout: 45
  # Blend: final = base * base_weight + llm * (1 - base_weight)
  base_weight: 0.65

engine:
  max_concurrency: 6
  # Minimum delay between two Telegram messages
  notify_throttle_seconds: 1.2
  # Live re-check offsets for already sent cards (minutes after sending)
  live_update_offsets_minutes: [3, 10, 30]
  # A card is marked as stale when proposals >= max_proposals * factor
  live_stale_proposals_factor: 2
  # Absolute proposal ceiling for the "many proposals" warning
  live_stale_proposals_absolute: 10
  # How many hours back cross-marketplace deduplication looks
  dedupe_window_hours: 48
  # Similarity threshold for cross-marketplace matching (0..1)
  dedupe_similarity: 0.88
