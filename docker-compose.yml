services:
  kwork-bot:
    build: .
    container_name: kwork-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/kwork.db
      TZ: Europe/Moscow
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os; print(os.path.exists('/app/data/kwork.db'))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
