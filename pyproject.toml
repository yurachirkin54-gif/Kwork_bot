[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kwork-bot"
version = "1.0.0"
description = "24/7 multi-marketplace freelance job monitor with smart scoring and a Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kwork_bot" }]

dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27,<0.29",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "SQLAlchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20,<1",
    "feedparser>=6.0.11,<7",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "rapidfuzz>=3.9,<4",
    "PyYAML>=6.0.1,<7",
    "loguru>=0.7.2,<1",
    "python-dateutil>=2.9,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1"]
browser = ["playwright>=1.45,<2"]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
]

[tool.setuptools]
packages = ["app", "app.core", "app.sources", "app.sources.native", "app.processing", "app.storage", "app.telegram", "app.telegram.handlers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
